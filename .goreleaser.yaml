version: 2

# **아카이브 이름을 고정한다.** goreleaser 는 project_name 을 저장소 이름에서
# 유추한다. 한때 릴리스를 별도 저장소로 보내려고 release.github.name 을 적었더니
# 그것이 파일명에 새어 들어가 `casebook-releases_darwin_arm64.tar.gz` 가 나왔다 —
# 빌드도 테스트도 통과하고 다운로드 링크만 죽는 종류다. 지금은 npm 이 배포 경로라
# 그 설정이 없지만, **이름을 유추에 맡기지 않는 규칙은 남긴다.**
# scripts/npm-pack.sh 가 이 파일명에 의존한다.
project_name: casebook

before:
  hooks:
    - go mod tidy

builds:
  - id: cb
    main: ./cmd/cb
    binary: cb
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/xian0310567/casebook/internal/adapter/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    # 배포물에 라이선스와 제3자 고지를 반드시 넣는다. 독점 소프트웨어라
    # EULA 가 동봉돼야 하고, 링크된 오픈소스 구성요소의 고지 의무도 여기서 진다.
    # (goreleaser 는 LICENSE·README 를 기본으로 넣지만 명시해 둔다 — 기본값이
    # 바뀌면 조용히 빠지는데, 그건 라이선스 위반이다.)
    files:
      - LICENSE
      - THIRD-PARTY-NOTICES.md
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^chore:']

# Homebrew tap.
#

# **npm 이 1차 배포 경로다** ([[casebook-결정-배포경로-npm우선]]).
#
# GitHub Releases 는 소스 저장소가 private 이라 낯선 사람이 못 받는다. npm 은 그
# 문제가 없고, MCP 생태계의 규범이며(`npx -y casebook mcp`), 팀이 package.json 으로
# 버전을 묶을 수 있다.
#
# 여기서는 **tar.gz 만 만든다.** npm 패키지 5개는 scripts/npm-pack.sh 가 그것으로
# 만들고, 릴리스 워크플로가 게시한다.
release:
  # private 저장소에도 릴리스는 남긴다 — 팀 내부 기록용이고, 배포 경로는 아니다.
  draft: false
