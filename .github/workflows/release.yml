name: release
on:
  push:
    tags: ['v*']
# **토큰을 쓰지 않는다.** npm 게시는 트러스티드 퍼블리싱(OIDC)으로 한다 —
# GitHub Actions 가 발급한 단명 토큰을 npm 이 직접 검증하므로, 레포 시크릿에
# 장기 토큰을 두지 않는다.
#
# 2026-08-10 에 옛 이름으로 첫 게시를 하며 겪은 것: 클래식 토큰은 폐지됐고,
# TOTP 2FA 는 등록 자체가 사라졌고, 보안 키는 CLI 에서 6자리 코드를 못 만든다.
# 남은 길이 "Granular token + Bypass 2FA 를 만들어 한 번 쓰고 폐기" 뿐이었다.
# OIDC 는 그 절차 전체를 없앤다.
#
# **트러스티드 퍼블리싱은 패키지가 이미 존재해야 설정할 수 있다.** 그래서 첫
# 게시만 사람이 하고(`npm publish` → 브라우저 WebAuthn), 그 뒤 `npm trust github`
# 로 이 워크플로를 등록한다. 등록 전에 이 파일이 먼저 들어가면 태그를 밀 때
# 인증이 없어서 실패한다.
permissions:
  contents: write # goreleaser 가 GitHub 릴리스를 만든다
  id-token: write # OIDC 토큰 발급 — npm 게시가 이것에 기댄다
jobs:
  # **테스트를 게이트로 건다.** 태그만 밀면 깨진 커밋도 그대로 나간다.
  # 릴리스는 되돌리기 어렵다 — npm 은 24시간 뒤 unpublish 도 막힌다.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      # **node 24 여야 한다.** 트러스티드 퍼블리싱은 npm 11.5.1 이상 · node 22.14
      # 이상을 요구한다. 옛 설정의 node 20 은 npm 10 을 물고 와서 OIDC 교환 자체를
      # 못 한다 — 그리고 그 실패는 "토큰이 없다" 로 보여서 원인이 안 드러난다.
      # registry-url 은 그대로 둔다. OIDC 여도 어느 레지스트리에 말하는지는 필요하다.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # 배포물에 EULA 와 제3자 고지가 반드시 들어가야 한다. 독점 소프트웨어라
      # 라이선스 동봉이 의무이고, 링크된 오픈소스의 고지 의무도 여기서 진다.
      - name: 라이선스 파일 존재 확인
        run: |
          for f in LICENSE THIRD-PARTY-NOTICES.md; do
            [ -s "$f" ] || { echo "$f 가 없거나 비었다 — 배포할 수 없다"; exit 1; }
          done
          grep -q 'proprietary software' LICENSE || {
            echo "LICENSE 가 독점 라이선스가 아니다 — 소스 비공개 배포와 어긋난다"; exit 1; }

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # **npm 이 1차 배포 경로다.** goreleaser 가 만든 tar.gz 를 풀어 패키지 5개로
      # 재포장한다. 플랫폼 패키지를 먼저 올려야 런처의 optionalDependencies 가
      # 해석된다 — 순서를 바꾸면 첫 설치가 바이너리를 못 찾는다.
      - name: npm 패키지 만들기
        run: ./scripts/npm-pack.sh "${GITHUB_REF_NAME}"

      # 토큰 환경변수를 주지 않는다 — npm 이 OIDC 로 스스로 인증한다.
      #
      # **`--provenance` 를 붙이지 마라. 이 저장소에서는 원리적으로 안 된다.**
      #
      # npm 문서는 "트러스티드 퍼블리싱이면 provenance 가 기본으로 붙는다" 고 하는데,
      # 실제 조건은 `npm/lib/utils/oidc.js` 에 있다:
      #
      #     if (ciInfo.GITHUB_ACTIONS && payload.repository_visibility === 'public')
      #
      # **레포가 public 일 때만 켠다.** 우리는 소스를 공개하지 않기로 했으므로
      # 해당되지 않는다. 2026-08-10 v0.1.2 게시에서 실측했다 — attestations: null.
      #
      # 그리고 그게 옳다. provenance 는 "이 공개 소스의 이 커밋에서 빌드됐다" 는
      # 증명인데, 아무도 소스를 볼 수 없으면 검증할 수 없는 주장이다. 플래그로
      # 강제하는 것은 확인할 수 없는 보증을 붙이는 일이다.
      - name: npm 게시
        run: |
          set -euo pipefail
          npm --version
          for d in dist/npm/darwin-* dist/npm/linux-*; do
            echo "게시: $d"
            npm publish "$d" --access public
          done
          # 런처는 마지막이다. 이게 올라가는 순간 사용자가 설치를 시작한다.
          npm publish dist/npm/priorcase --access public
