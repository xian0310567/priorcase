name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  # **테스트를 게이트로 건다.** 태그만 밀면 깨진 커밋도 그대로 나간다.
  # 릴리스는 되돌리기 어렵다 — npm 은 24시간 뒤 unpublish 도 막힌다.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # 배포물에 EULA 와 제3자 고지가 반드시 들어가야 한다. 독점 소프트웨어라
      # 라이선스 동봉이 의무이고, 링크된 오픈소스의 고지 의무도 여기서 진다.
      - name: 라이선스 파일 존재 확인
        run: |
          for f in LICENSE THIRD-PARTY-NOTICES.md; do
            [ -s "$f" ] || { echo "$f 가 없거나 비었다 — 배포할 수 없다"; exit 1; }
          done
          grep -q 'proprietary software' LICENSE || {
            echo "LICENSE 가 독점 라이선스가 아니다 — 소스 비공개 배포와 어긋난다"; exit 1; }

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # **npm 이 1차 배포 경로다.** goreleaser 가 만든 tar.gz 를 풀어 패키지 5개로
      # 재포장한다. 플랫폼 패키지를 먼저 올려야 런처의 optionalDependencies 가
      # 해석된다 — 순서를 바꾸면 첫 설치가 바이너리를 못 찾는다.
      - name: npm 패키지 만들기
        run: ./scripts/npm-pack.sh "${GITHUB_REF_NAME}"

      - name: npm 게시
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for d in dist/npm/darwin-* dist/npm/linux-*; do
            echo "게시: $d"
            npm publish "$d" --access public --provenance
          done
          # 런처는 마지막이다. 이게 올라가는 순간 사용자가 설치를 시작한다.
          npm publish dist/npm/casebook --access public --provenance
