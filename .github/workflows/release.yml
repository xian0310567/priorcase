name: release
on:
  push:
    tags: ['v*']
# **토큰을 쓰지 않는다.** npm 게시는 트러스티드 퍼블리싱(OIDC)으로 한다 —
# GitHub Actions 가 발급한 단명 토큰을 npm 이 직접 검증하므로, 레포 시크릿에
# 장기 토큰을 두지 않는다.
#
# 2026-08-10 에 옛 이름으로 첫 게시를 하며 겪은 것: 클래식 토큰은 폐지됐고,
# TOTP 2FA 는 등록 자체가 사라졌고, 보안 키는 CLI 에서 6자리 코드를 못 만든다.
# 남은 길이 "Granular token + Bypass 2FA 를 만들어 한 번 쓰고 폐기" 뿐이었다.
# OIDC 는 그 절차 전체를 없앤다.
#
# **트러스티드 퍼블리싱은 패키지가 이미 존재해야 설정할 수 있다.** 그래서 첫
# 게시만 사람이 하고(`npm publish` → 브라우저 WebAuthn), 그 뒤 `npm trust github`
# 로 이 워크플로를 등록한다. 등록 전에 이 파일이 먼저 들어가면 태그를 밀 때
# 인증이 없어서 실패한다.
permissions:
  contents: write # goreleaser 가 GitHub 릴리스를 만든다
  id-token: write # OIDC 토큰 발급 — npm 게시가 이것에 기댄다
jobs:
  # **테스트를 게이트로 건다.** 태그만 밀면 깨진 커밋도 그대로 나간다.
  # 릴리스는 되돌리기 어렵다 — npm 은 24시간 뒤 unpublish 도 막힌다.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go test -race ./...

  # ── 데스크탑 앱 ───────────────────────────────────────────────────────
  #
  # **CLI 릴리스와 따로 돈다.** 앱은 CLI 위의 얇은 설정 콘솔이라 갱신 주기가 다르고
  # (무거운 로직은 전부 prior 에 있다), 앱 빌드가 깨져도 npm 배포는 나가야 한다.
  #
  # 사내가 윈도우·맥 혼용이라 둘 다 만든다 — 기획자는 윈도우, 개발자는 맥이다.
  # **runner 가 곧 타깃이다**: Tauri 는 크로스컴파일을 안 하므로 macOS 산출물은
  # macOS 러너에서, 윈도우 산출물은 윈도우 러너에서만 나온다.
  #
  # 지금은 **아티팩트로만 남긴다.** 배포 자리(회사 CodeCommit·드라이브 등)가 아직
  # 안 정해졌고, 정해지기 전에 어딘가로 올리면 그 자리가 기본값이 되어 굳는다.
  app:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Rust 빌드가 이 워크플로에서 가장 느리다. 타깃별로 캐시를 가른다 —
      # 안 가르면 arm64 와 x64 가 서로의 캐시를 무효화한다.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}

      # **Go 도 필요하다.** 앱에 prior 를 사이드카로 넣기 때문이다 — 그래야 Node 를
      # 안 깐 사람도 앱 하나로 쓸 수 있다 (bundle-prior.sh 의 §).
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: prior 사이드카 만들기
        shell: bash
        working-directory: .
        env:
          PRIORCASE_VERSION: ${{ github.ref_name }}
        run: app/scripts/bundle-prior.sh ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile
      # **프런트 검사를 먼저 건다.** Rust 빌드가 몇 분이라, 타입 오류로 그걸 다
      # 태우고 나서 실패하면 되돌아오는 데만 두 배가 든다.
      - run: pnpm test
      - run: pnpm build

      # 앱 판을 태그에 맞춘다. 안 맞추면 설치 화면이 tauri.conf.json 에 박힌 옛
      # 숫자를 그대로 보여 주고, 사람은 그걸 받은 판이라고 읽는다.
      #
      # heredoc 을 안 쓴다 — YAML 블록 스칼라 안에서 종료자의 들여쓰기가 조용히
      # 어긋나면 스크립트가 통째로 안 끝난다. node 는 이 잡에 이미 있다.
      - name: 앱 판을 태그에 맞춘다
        shell: bash
        run: |
          set -euo pipefail
          node scripts/set-app-version.mjs "${GITHUB_REF_NAME#v}"

      - name: 앱 빌드
        run: pnpm tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: priorcase-app-${{ matrix.label }}
          # dmg(맥)·exe(윈도우 NSIS) 둘 다 집는다. 경로가 타깃마다 달라 넓게 잡고,
          # if-no-files-found 로 **조용히 빈 아티팩트가 나오는 것**을 막는다.
          path: |
            app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      # **node 24 여야 한다.** 트러스티드 퍼블리싱은 npm 11.5.1 이상 · node 22.14
      # 이상을 요구한다. 옛 설정의 node 20 은 npm 10 을 물고 와서 OIDC 교환 자체를
      # 못 한다 — 그리고 그 실패는 "토큰이 없다" 로 보여서 원인이 안 드러난다.
      # registry-url 은 그대로 둔다. OIDC 여도 어느 레지스트리에 말하는지는 필요하다.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # 배포물에 EULA 와 제3자 고지가 반드시 들어가야 한다. 독점 소프트웨어라
      # 라이선스 동봉이 의무이고, 링크된 오픈소스의 고지 의무도 여기서 진다.
      - name: 라이선스 파일 존재 확인
        run: |
          for f in LICENSE THIRD-PARTY-NOTICES.md; do
            [ -s "$f" ] || { echo "$f 가 없거나 비었다 — 배포할 수 없다"; exit 1; }
          done
          grep -q 'proprietary software' LICENSE || {
            echo "LICENSE 가 독점 라이선스가 아니다 — 소스 비공개 배포와 어긋난다"; exit 1; }

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # **npm 이 1차 배포 경로다.** goreleaser 가 만든 tar.gz 를 풀어 패키지 5개로
      # 재포장한다. 플랫폼 패키지를 먼저 올려야 런처의 optionalDependencies 가
      # 해석된다 — 순서를 바꾸면 첫 설치가 바이너리를 못 찾는다.
      # ⚠️ **win32 을 임시로 뺀다 (2026-09-02).**
      #
      # 트러스티드 퍼블리싱은 이미 존재하는 패키지에만 걸 수 있는데(이 파일 머리의 §),
      # `priorcase-win32-x64`·`priorcase-win32-arm64` 는 이번에 처음 생기는 이름이라
      # OIDC 로 만들 수 없다. v0.5.0 이 그래서 절반만 나갔다 — 플랫폼 4개는 게시됐고
      # win32 둘이 404 를 내면서 런처까지 못 나갔다.
      #
      # **되돌리는 법 (사람이 한 번만 하면 된다):**
      #
      #	npm login
      #	npm publish dist/npm/win32-x64 --access public      # scripts/npm-pack.sh 로 만든 것
      #	npm publish dist/npm/win32-arm64 --access public
      #	npm trust github priorcase-win32-x64   --file .github/workflows/release.yml --repo xian0310567/priorcase
      #	npm trust github priorcase-win32-arm64 --file .github/workflows/release.yml --repo xian0310567/priorcase
      #
      # 그 뒤 **아래 env 두 줄을 지우면** 다음 태그부터 여섯 플랫폼이 전부 나간다.
      # GitHub 릴리스의 윈도우 zip 은 이 스위치와 무관하게 계속 나가므로, 그때까지
      # 윈도우 사용자는 릴리스 페이지에서 받을 수 있다.
      - name: npm 패키지 만들기
        env:
          PRIORCASE_SKIP_PLATFORMS: win32
        run: ./scripts/npm-pack.sh "${GITHUB_REF_NAME}"

      # 토큰 환경변수를 주지 않는다 — npm 이 OIDC 로 스스로 인증한다.
      #
      # **`--provenance` 를 붙이지 마라. 이 저장소에서는 원리적으로 안 된다.**
      #
      # npm 문서는 "트러스티드 퍼블리싱이면 provenance 가 기본으로 붙는다" 고 하는데,
      # 실제 조건은 `npm/lib/utils/oidc.js` 에 있다:
      #
      #     if (ciInfo.GITHUB_ACTIONS && payload.repository_visibility === 'public')
      #
      # **레포가 public 일 때만 켠다.** 우리는 소스를 공개하지 않기로 했으므로
      # 해당되지 않는다. 2026-08-10 v0.1.2 게시에서 실측했다 — attestations: null.
      #
      # 그리고 그게 옳다. provenance 는 "이 공개 소스의 이 커밋에서 빌드됐다" 는
      # 증명인데, 아무도 소스를 볼 수 없으면 검증할 수 없는 주장이다. 플래그로
      # 강제하는 것은 확인할 수 없는 보증을 붙이는 일이다.
      - name: npm 게시
        run: |
          set -euo pipefail
          npm --version
          for d in dist/npm/darwin-* dist/npm/linux-* dist/npm/win32-*; do
            echo "게시: $d"
            npm publish "$d" --access public
          done
          # 런처는 마지막이다. 이게 올라가는 순간 사용자가 설치를 시작한다.
          npm publish dist/npm/priorcase --access public
